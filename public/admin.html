<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel de Control - Streamer</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e1e1e; padding: 20px 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); text-align: center; width: 300px; }
        button { width: 100%; margin: 8px 0; padding: 12px; font-size: 16px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-start { background: #28a745; color: white; }
        .btn-pause { background: #ffc107; color: black; }
        .btn-resume { background: #17a2b8; color: white; }
        button:hover { opacity: 0.85; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Control de Transmisión</h2>
        <button class="btn-start" onclick="iniciarVideo()">▶ Reiniciar desde el inicio</button>
        <button id="btnPausa" class="btn-pause" onclick="togglePausa()">⏸ Pausar</button>
    </div>

    <script>
        const socket = io();
        let estaPausado = false;

        function iniciarVideo() {
            estaPausado = false;
            actualizarBotonPausa(); // Resetea el botón a "Pausar"
            socket.emit('play-video', { time: 0 });
        }

        function togglePausa() {
            const btn = document.getElementById('btnPausa');
            if (!estaPausado) {
                // Pausar
                estaPausado = true;
                socket.emit('pause-video');
            } else {
                // Continuar/Reanudar
                estaPausado = false;
                socket.emit('resume-video');
            }
            actualizarBotonPausa();
        }

        function actualizarBotonPausa() {
            const btn = document.getElementById('btnPausa');
            if (estaPausado) {
                btn.innerText = "▶ Continuar";
                btn.className = "btn-resume";
            } else {
                btn.innerText = "⏸ Pausar";
                btn.className = "btn-pause";
            }
        }
    </script>
</body>
</html>
