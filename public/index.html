<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videoreacción en Vivo</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0b0e0f;
            color: #ffffff;
            font-family: Arial, sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        #status {
            background: #181c1e;
            padding: 8px 15px;
            font-size: 13px;
            color: #53fc18;
            text-align: center;
            border-bottom: 1px solid #282d30;
        }

        /* Contenedor Principal con Layout Flex (Video a la izquierda, Chat a la derecha) */
        .main-layout {
            display: flex;
            flex: 1;
            height: calc(100vh - 35px);
            width: 100%;
            position: relative;
        }

        /* Área de Video Principal + Cámara Flotante */
        .stream-container {
            flex: 1;
            position: relative;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #videoPrivate {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        #videoPrivate::-webkit-media-controls-play-button,
        #videoPrivate::-webkit-media-controls-start-playback-button,
        #videoPrivate::-webkit-media-controls-fullscreen-button {
            display: none !important;
            -webkit-appearance: none;
        }

        /* Cámara de Kick Recortada (Esquina Inferior Izquierda) */
        .kick-crop-box {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 260px;
            height: 190px;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #53fc18;
            box-shadow: 0 8px 24px rgba(0,0,0,0.8);
            background: #000;
            z-index: 10;
        }

        .kick-crop-box iframe {
            width: 160%;
            height: 160%;
            margin-left: -30%;
            margin-top: -20%;
            border: none;
            pointer-events: none;
        }

        /* Contenedor del Chat en Vivo (Barra Lateral Derecha) */
        .chat-container {
            width: 340px;
            height: 100%;
            background: #191b1f;
            border-left: 1px solid #282d30;
        }

        .chat-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Botones Flotantes de Kick (Seguir y Suscribir) */
        .kick-actions {
            position: absolute;
            top: 20px;
            right: 360px; /* Desplazado para no tapar el chat */
            display: flex;
            gap: 12px;
            z-index: 20;
        }

        .btn-kick {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            font-weight: bold;
            font-size: 14px;
            text-decoration: none;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: transform 0.2s;
            animation: pulseAttention 5s infinite;
        }

        .btn-follow {
            background-color: #53fc18;
            color: #000;
        }

        .btn-subscribe {
            background-color: #00e701;
            color: #000;
            animation-delay: 0.5s; /* Desfase animación */
        }

        .btn-kick:hover {
            transform: scale(1.08);
        }

        /* Animación Periódica de Atención (Pulso/Vibración) */
        @keyframes pulseAttention {
            0%, 80%, 100% {
                transform: scale(1);
            }
            85% {
                transform: scale(1.12) rotate(-3deg);
            }
            90% {
                transform: scale(1.12) rotate(3deg);
            }
            95% {
                transform: scale(1.08) rotate(0deg);
            }
        }
    </style>
</head>
<body>

    <div id="status">Estado: Conectando al servidor...</div>

    <div class="main-layout">
        <!-- Panel Izquierdo: Video y Transmisión -->
        <div class="stream-container">
            
            <!-- Botones de Acción Kick (Seguir / Suscribirse) -->
            <div class="kick-actions">
                <!-- REEMPLAZA "TU_CANAL_KICK" por tu nombre de usuario exacto -->
                <a href="https://kick.com/TU_CANAL_KICK" target="_blank" class="btn-kick btn-follow">
                    💚 Seguir en Kick
                </a>
                <a href="https://kick.com/TU_CANAL_KICK/subscribe" target="_blank" class="btn-kick btn-subscribe">
                    ⭐ Suscribirse
                </a>
            </div>

            <!-- Video Reacción Principal -->
            <video id="videoPrivate" controls controlsList="nodownload nofullscreen noremoteplayback"></video>

            <!-- Cámara Recortada de Kick -->
            <div class="kick-crop-box">
                <iframe src="https://player.kick.com/TU_CANAL_KICK" allowfullscreen="true"></iframe>
            </div>
        </div>

        <!-- Panel Derecho: Chat Incrustado de Kick -->
        <div class="chat-container">
            <iframe src="https://kick.com/popout/TU_CANAL_KICK/chat"></iframe>
        </div>
    </div>
	<script>
        const video = document.getElementById('videoPrivate');
        // Enlace al archivo .m3u8 que subirás a GitHub Releases o Cloudflare
        const videoSrc = 'https://cdn.jsdelivr.net/gh/vchicolatino/vchicolatino@main/public/video/db/Peliculas/Freezer%20contra%20el%20padre%20de%20Goku/stream.m3u8'; 
        const socket = io();

        if (Hls.isSupported()) {
            const hls = new Hls();
            hls.loadSource(videoSrc);
            hls.attachMedia(video);
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = videoSrc;
        }

        // Escuchar órdenes de sincronización en tiempo real
        socket.on('sync-state', (data) => {
            if(data.playing) {
                video.currentTime = data.time;
                video.play();
            }
        });

        socket.on('play-video', (data) => {
            video.currentTime = data.time;
            video.play();
        });

        socket.on('pause-video', () => { video.pause(); });
        socket.on('seek-video', (data) => { video.currentTime = data.time; });
		
		// NUEVO: Reanudar desde donde se pausó
        socket.on('resume-video', () => {
            video.play().catch(err => {
                //statusDiv.innerText = "Haz clic en el video para reanudar";
            });
            //statusDiv.innerText = "Estado: Reproduciendo...";
        });
    </script>
</body>
</html>
