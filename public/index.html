<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videoreacción en Vivo</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0b0e0f;
            color: #ffffff;
            font-family: Arial, sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Indicador de estado superior */
        #status {
            background: #181c1e;
            padding: 8px 15px;
            font-size: 13px;
            color: #53fc18; /* Verde Kick */
            text-align: center;
            border-bottom: 1px solid #282d30;
        }

        /* Contenedor Principal de Transmisión */
        .stream-container {
            display: flex;
            flex: 1;
            position: relative;
            width: 100%;
            height: calc(100vh - 35px);
            background: #000;
        }

        /* 1. REPRODUCTOR PRINCIPAL (Video Reacción) */
        .main-video-wrapper {
            flex: 1;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
        }

        #videoPrivate {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Ocultar botón de Play/Pausa e Fullscreen nativos */
        #videoPrivate::-webkit-media-controls-play-button,
        #videoPrivate::-webkit-media-controls-start-playback-button,
        #videoPrivate::-webkit-media-controls-fullscreen-button {
            display: none !important;
            -webkit-appearance: none;
        }

        /* 2. REPRODUCTOR SECUNDARIO (Cámara de Kick Recortada) */
        .kick-crop-box {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 280px;  /* Ancho de la caja recorta */
            height: 210px; /* Alto de la caja recorta */
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #53fc18;
            box-shadow: 0 8px 24px rgba(0,0,0,0.8);
            background: #000;
            z-index: 10;
        }

        /* Recorte enfocando el centro del reproductor Kick */
        .kick-crop-box iframe {
            width: 110%;
            height: 110%;
            margin-left: -30%; /* Desplaza horizontalmente al centro */
            /*margin-top: -20%;  Desplaza verticalmente al centro */
            border: none;
            pointer-events: none; /* Deshabilita clics e interacción en la cámara */
        }
    </style>
</head>
<body>

    <div id="status">Estado: Conectando al servidor...</div>

    <div class="stream-container">
        <!-- Reproductor de Video Reacción (Grande) -->
        <div class="main-video-wrapper">
            <video id="videoPrivate" controls controlsList="nodownload nofullscreen noremoteplayback"></video>
        </div>

        <!-- Inserción de Kick Recortada en la Esquina (Pequeño) -->
        <div class="kick-crop-box">
            <!-- Reemplaza TU_CANAL_KICK por el nombre exacto de tu canal -->
            <iframe 
                src="https://player.kick.com/TU_CANAL_KICK" 
                allowfullscreen="true">
            </iframe>
        </div>
    </div>
	<script>
        const video = document.getElementById('videoPrivate');
        // Enlace al archivo .m3u8 que subirás a GitHub Releases o Cloudflare
        const videoSrc = 'https://cdn.jsdelivr.net/gh/vchicolatino/vchicolatino@main/public/video/db/Peliculas/Freezer%20contra%20el%20padre%20de%20Goku/stream.m3u8'; 
        const socket = io();

        if (Hls.isSupported()) {
            const hls = new Hls();
            hls.loadSource(videoSrc);
            hls.attachMedia(video);
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = videoSrc;
        }

        // Escuchar órdenes de sincronización en tiempo real
        socket.on('sync-state', (data) => {
            if(data.playing) {
                video.currentTime = data.time;
                video.play();
            }
        });

        socket.on('play-video', (data) => {
            video.currentTime = data.time;
            video.play();
        });

        socket.on('pause-video', () => { video.pause(); });
        socket.on('seek-video', (data) => { video.currentTime = data.time; });
		
		// NUEVO: Reanudar desde donde se pausó
        socket.on('resume-video', () => {
            video.play().catch(err => {
                //statusDiv.innerText = "Haz clic en el video para reanudar";
            });
            //statusDiv.innerText = "Estado: Reproduciendo...";
        });
    </script>
</body>
</html>
