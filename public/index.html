<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videoreacción en Vivo</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0b0e0f;
            color: #ffffff;
            font-family: Arial, sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        #status {
            background: #181c1e;
            padding: 8px 15px;
            font-size: 13px;
            color: #53fc18;
            text-align: center;
            border-bottom: 1px solid #282d30;
        }

        /* Layout Principal */
        .main-layout {
            display: flex;
            flex: 1;
            height: calc(100vh - 35px);
            width: 100%;
            position: relative;
        }

        /* 1. CONTENEDOR UNIFICADO DE REPRODUCCIÓN (SE PUEDE MAXIMIZAR) */
        .player-theater {
            flex: 1;
            position: relative;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
        }

        /* Video Reacción Principal */
        #videoPrivate {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        #videoPrivate::-webkit-media-controls-play-button,
        #videoPrivate::-webkit-media-controls-start-playback-button,
        #videoPrivate::-webkit-media-controls-fullscreen-button {
            display: none !important;
            -webkit-appearance: none;
        }

        /* Cámara de Kick Recortada */
        .kick-crop-box {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 260px;
            height: 190px;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #53fc18;
            box-shadow: 0 8px 24px rgba(0,0,0,0.8);
            background: #000;
            z-index: 10;
        }

        .kick-crop-box iframe {
            width: 160%;
            height: 160%;
            margin-left: -30%;
            margin-top: -20%;
            border: none;
            pointer-events: none;
        }

        /* Botones Flotantes de Kick */
        .kick-actions {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 12px;
            z-index: 20;
        }

        .btn-kick {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            font-weight: bold;
            font-size: 14px;
            text-decoration: none;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: transform 0.2s;
            animation: pulseAttention 5s infinite;
            cursor: pointer;
            border: none;
        }

        .btn-follow {
            background-color: #53fc18;
            color: #000;
        }

        .btn-subscribe {
            background-color: #00e701;
            color: #000;
            animation-delay: 0.5s;
        }

        .btn-fullscreen {
            background-color: #282d30;
            color: #fff;
            animation: none; /* Sin vibración para el botón de maximizar */
        }

        .btn-kick:hover {
            transform: scale(1.08);
        }

        /* Estilos cuando la caja entra en Pantalla Completa */
        .player-theater:fullscreen {
            width: 100vw;
            height: 100vh;
        }

        .player-theater:-webkit-full-screen {
            width: 100vw;
            height: 100vh;
        }

        /* 2. CHAT DE KICK */
        .chat-container {
            width: 340px;
            height: 100%;
            background: #191b1f;
            border-left: 1px solid #282d30;
        }

        .chat-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Animación Periódica de Atención */
        @keyframes pulseAttention {
            0%, 80%, 100% {
                transform: scale(1);
            }
            85% {
                transform: scale(1.12) rotate(-3deg);
            }
            90% {
                transform: scale(1.12) rotate(3deg);
            }
            95% {
                transform: scale(1.08) rotate(0deg);
            }
        }
    </style>
</head>
<body>

    <div class="main-layout">
        
        <!-- DIV UNIFICADO: Contiene Video, Cámara, Botones y Soporta Pantalla Completa -->
        <div id="playerTheater" class="player-theater">
            
            <!-- Botones de Acción Kick + Botón Maximizar -->
            <div class="kick-actions">
                <!-- REEMPLAZA "TU_CANAL_KICK" por tu usuario exacto -->
                <a href="https://kick.com/vchicolatino" target="_blank" class="btn-kick btn-follow">
                    💚 Seguir en Kick
                </a>
                <a href="https://kick.com/vchicolatino/subscribe" target="_blank" class="btn-kick btn-subscribe">
                    ⭐ Suscribirse
                </a>
                <button class="btn-kick btn-fullscreen" onclick="toggleFullscreen()">
                    ⛶ Maximizar
                </button>
            </div>

            <!-- Video Reacción Principal -->
            <video id="videoPrivate" controls controlsList="nodownload nofullscreen noremoteplayback"></video>

            <!-- Cámara Recortada de Kick -->
            <div class="kick-crop-box">
                <iframe src="https://player.kick.com/vchicolatino" allowfullscreen="true"></iframe>
            </div>

        </div>

        <!-- Panel del Chat de Kick -->
        <div class="chat-container">
            <iframe src="https://kick.com/popout/vchicolatino/chat"></iframe>
        </div>

    </div>
	<script>
        const video = document.getElementById('videoPrivate');
		const theaterDiv = document.getElementById('playerTheater');
        // Enlace al archivo .m3u8 que subirás a GitHub Releases o Cloudflare
        const videoSrc = 'https://cdn.jsdelivr.net/gh/vchicolatino/vchicolatino@main/public/video/db/Peliculas/Freezer%20contra%20el%20padre%20de%20Goku/stream.m3u8'; 
        const socket = io();

		// Función para activar/desactivar pantalla completa en el Div Unificado
        function toggleFullscreen() {
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                if (theaterDiv.requestFullscreen) {
                    theaterDiv.requestFullscreen();
                } else if (theaterDiv.webkitRequestFullscreen) {
                    theaterDiv.webkitRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                }
            }
        }
		
        if (Hls.isSupported()) {
            const hls = new Hls();
            hls.loadSource(videoSrc);
            hls.attachMedia(video);
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = videoSrc;
        }

        // Escuchar órdenes de sincronización en tiempo real
        socket.on('sync-state', (data) => {
            if(data.playing) {
                video.currentTime = data.time;
                video.play();
            }
        });

        socket.on('play-video', (data) => {
            video.currentTime = data.time;
            video.play();
        });

        socket.on('pause-video', () => { video.pause(); });
        socket.on('seek-video', (data) => { video.currentTime = data.time; });
		
		// NUEVO: Reanudar desde donde se pausó
        socket.on('resume-video', () => {
            video.play().catch(err => {
                //statusDiv.innerText = "Haz clic en el video para reanudar";
            });
            //statusDiv.innerText = "Estado: Reproduciendo...";
        });
    </script>
</body>
</html>
