<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videoreacción en Vivo</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0b0e0f;
            color: #ffffff;
            font-family: Arial, sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        #status {
            background: #181c1e;
            padding: 6px 15px;
            font-size: 12px;
            color: #53fc18;
            text-align: center;
            border-bottom: 1px solid #282d30;
        }

        .main-layout {
            display: flex;
            flex: 1;
            height: calc(100vh - 30px);
            width: 100%;
            position: relative;
        }

        /* CONTENEDOR UNIFICADO */
        .player-theater {
            flex: 1;
            position: relative;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: flex-start;
            width: 100%;
            height: 100%;
        }
		
		/* CONTENEDOR ESPECÍFICO DE VIDEO Y LABELS */
        .video-wrapper {
            width: calc(100% - 150px);
            height: calc(100% - 45px);
            margin-left: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 10px 0;
        }

        .video-label {
            width: 100%;
            font-size: 22px;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            /* Configuración para permitir saltos de línea */
			white-space: normal;       /* Permite que el texto baje a la siguiente línea */
			word-break: break-word;     /* Rompe palabras muy largas si no caben */
			overflow-wrap: break-word; /* Asegura el ajuste en navegadores modernos */
            padding: 4px 6px;
        }

        .video-label-top {
            text-align: left;
            color: #53fc18;
        }

        .video-label-bottom {
            text-align: center;
            color: #cccccc;
            //font-size: 22px;
        }

        #videoPrivate {
            width: calc(100% - 130px);
            height: calc(100% - 45px);
            margin-left: 20px;
            margin-top: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
            border: 2px solid #53fc18;
            box-shadow: 0 8px 24px rgba(0,0,0,0.8);
            object-fit: contain;
        }

        video::-webkit-media-controls {
            display: none !important;
        }

		/* Cámara Recortada de Kick (Sin franjas negras) */
		.kick-crop-box {
			position: absolute;
			top: 20px;
			right: 40px;
			width: 175px;
			height: 240px;
			border-radius: 10px;
			overflow: hidden;
			border: 2px solid #53fc18;
			box-shadow: 0 8px 24px rgba(0,0,0,0.8);
			background: #000;
			display: flex;
			justify-content: center;
			align-items: center;
			z-index: 10;
		}

		/* Escalar iframe para forzar llenado vertical completo */
		.kick-crop-box iframe {
			width: 350%; /* Aumentado para eliminar bordes laterales y cubrir alto */
			height: 100%;
			transform: scale(1.4); /* Amplía levemente la señal para eliminar franjas negras arriba/abajo */
			transform-origin: center center;
			border: none;
			pointer-events: none; /* Mantiene el clic transparente hacia la interfaz */
		}

        /* Botones Flotantes de Kick */
        .kick-actions {
            position: absolute;
            top: 270px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 20;
        }

        .btn-kick {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            font-weight: bold;
            font-size: 13px;
            text-decoration: none;
            border-radius: 6px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: transform 0.2s;
            animation: pulseAttention 5s infinite;
            cursor: pointer;
            border: none;
        }

        .btn-follow { background-color: #53fc18; color: #000; }
        .btn-subscribe { background-color: #00e701; color: #000; animation-delay: 0.5s; }
        .btn-kick:hover { transform: scale(1.05); }

        /* BARRA DE CONTROLES UNIFICADA */
        .custom-controls-bar {
            width: 100%;
            height: 45px;
            background: #121415;
            display: flex;
            align-items: center;
            padding: 0 15px;
            gap: 15px;
            z-index: 30;
            border-top: 1px solid #282d30;
        }

        /* BOTÓN EN VIVO */
        .btn-live {
            display: flex;
            align-items: center;
            gap: 6px;
            background: transparent;
            border: none;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
            transition: all 0.2s ease;
            color: #777;
        }

        .btn-live .live-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #777;
            display: inline-block;
            transition: background-color 0.2s ease;
        }

        .btn-live.is-live { color: #ff3333; }

        .btn-live.is-live .live-dot {
            background-color: #ff3333;
            box-shadow: 0 0 8px rgba(255, 51, 51, 0.8);
            animation: blinkLive 1.5s infinite;
        }

        .btn-live:hover { background: rgba(255, 255, 255, 0.05); }

        @keyframes blinkLive {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .progress-container {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .progress-bar-bg {
            width: 100%;
            height: 6px;
            background: #333;
            border-radius: 3px;
            position: relative;
            overflow: hidden;
            pointer-events: none;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: #53fc18;
            transition: width 0.2s linear;
        }

        .time-display {
            font-size: 12px;
            font-family: monospace;
            color: #ccc;
            white-space: nowrap;
        }

        .volume-container {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
        }

        .btn-volume-icon {
            background: transparent;
            border: none;
            font-size: 16px;
            cursor: pointer;
            padding: 2px 4px;
            border-radius: 4px;
            user-select: none;
            transition: transform 0.1s ease;
        }

        .btn-volume-icon:hover { transform: scale(1.15); }

        .volume-slider {
            width: 80px;
            accent-color: #53fc18;
            cursor: pointer;
        }

        .btn-fs-native {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            padding: 5px;
            transition: color 0.2s;
        }

        .btn-fs-native:hover { color: #53fc18; }

        .player-theater:fullscreen { width: 100vw; height: 100vh; }
        .player-theater:-webkit-full-screen { width: 100vw; height: 100vh; }

        /* Chat Lateral */
        .chat-container {
            width: 320px;
            height: 100%;
            background: #191b1f;
            border-left: 1px solid #282d30;
            display: flex;
            flex-direction: column;
        }

        .btn-toggle-chat {
            display: none; /* Oculto en PC */
        }

        .chat-container iframe { width: 100%; height: 100%; border: none; }

        @keyframes pulseAttention {
            0%, 80%, 100% { transform: scale(1); }
            85% { transform: scale(1.1) rotate(-2deg); }
            90% { transform: scale(1.1) rotate(2deg); }
            95% { transform: scale(1.05) rotate(0deg); }
        }

        /* =========================================================
           VISTA ADAPTADA PARA DISPOSITIVOS MÓVILES (Móvil/Tablet)
           ========================================================= */
        @media (max-width: 768px) {
            body {
                overflow-y: auto; /* Permitir scroll si es necesario */
            }

            .main-layout {
                flex-direction: column;
                height: auto;
            }

			.video-wrapper { 
				width: calc(100% - 60px) !important;
				margin-left: 10px;
			}
			
            /* Reducción del 10% en el alto del contenedor principal */
            .player-theater {
                height: calc(90vh - 30px) !important;
                min-height: 380px;
                width: 100%;
            }

            #videoPrivate {
                width: calc(100% - 60px) !important;
                margin-left: 10px;
                margin-top: 10px;
                margin-bottom: 10px;
            }

            /* Reducción del 10% en el contenedor de Kick (175x240 -> 157x216) */
            .kick-crop-box {
                width: 100px !important;
                height: 160px !important;
                top: 10px;
                right: 10px;
            }

            .kick-actions {
                top: 220px;
                right: 10px;
				display: block;
            }

            .btn-kick {
                padding: 6px 10px;
                font-size: 11px;
            }

            .volume-slider {
                width: 50px; /* Ajuste del slider para pantallas angostas */
            }

            /* Chat Desplegable */
            .chat-container {
                width: 100%;
                height: 400px;
                border-left: none;
                border-top: 1px solid #282d30;
                transition: max-height 0.3s ease;
            }

            .btn-toggle-chat {
                display: block;
                width: 100%;
                background: #181c1e;
                color: #53fc18;
                border: none;
                padding: 8px;
                font-size: 12px;
                font-weight: bold;
                cursor: pointer;
                border-bottom: 1px solid #282d30;
                text-align: center;
            }

            .chat-container.collapsed iframe {
                display: none;
            }

            .chat-container.collapsed {
                height: auto;
            }
        }
    </style>
</head>
<body>
    <div class="main-layout">
        
        <!-- DIV UNIFICADO DE REPRODUCCIÓN -->
        <div id="playerTheater" class="player-theater">
            
            <!-- Botones de Acción Kick -->
            <div class="kick-actions">
                <a href="https://kick.com/vchicolatino" target="_blank" class="btn-kick btn-follow">💚 Seguir</a>
                <a href="https://kick.com/vchicolatino/subscribe" target="_blank" class="btn-kick btn-subscribe">⭐ Suscribirse</a>
            </div>

            <!-- CONTENEDOR CON LABELS Y VIDEO -->
            <div class="video-wrapper">
                <div id="labelTop" class="video-label video-label-top"></div>
                <video id="videoPrivate" playsinline muted></video>
                <div id="labelBottom" class="video-label video-label-bottom"></div>
            </div>
			
			<!-- Cámara Recortada de Kick con permisos de audio habilitados -->
			<div class="kick-crop-box">
				<iframe 
					id="kickIframe"
					src="https://player.kick.com/vchicolatino?autoplay=true&muted=false" 
					allow="autoplay; encrypted-media; picture-in-picture"
					allowfullscreen="true">
				</iframe>
			</div>

            <!-- BARRA DE CONTROLES UNIFICADA -->
            <div class="custom-controls-bar">
                
                <!-- BOTÓN EN VIVO -->
                <button id="btnLive" class="btn-live" onclick="irAlEnVivo()" title="Hacer clic para volver al en vivo">
                    <span class="live-dot"></span> EN VIVO
                </button>
                
                <!-- Progreso del Video y Tiempo Restante -->
                <div class="progress-container">
                    <div class="progress-bar-bg">
                        <div id="progressFill" class="progress-bar-fill"></div>
                    </div>
                    <div id="timeDisplay" class="time-display">-00:00</div>
                </div>

                <!-- Control Unificado de Volumen -->
                <div class="volume-container">
                    <button id="btnVolume" class="btn-volume-icon" onclick="toggleMute()" title="Silenciar / Activar sonido">🔊</button>
                    <input type="range" id="volumeSlider" class="volume-slider" min="0" max="1" step="0.05" value="1" oninput="ajustarVolumen(this.value)">
                </div>

                <!-- Botón de Maximizar Todo el Div -->
                <button class="btn-fs-native" onclick="toggleFullscreen()" title="Pantalla Completa">
                    ⛶
                </button>

            </div>

        </div>

        <!-- Chat de Kick (Desplegable en móvil) -->
        <div id="chatContainer" class="chat-container">
            <button class="btn-toggle-chat" onclick="toggleChatMovil()">💬 Ocultar / Mostrar Chat</button>
            <iframe src="https://kick.com/popout/vchicolatino/chat"></iframe>
        </div>

    </div>

    <script>
        const video = document.getElementById('videoPrivate');
        const theaterDiv = document.getElementById('playerTheater');
        const progressFill = document.getElementById('progressFill');
        const timeDisplay = document.getElementById('timeDisplay');
        const volumeSlider = document.getElementById('volumeSlider');
        const btnVolume = document.getElementById('btnVolume');
        const btnLive = document.getElementById('btnLive');
        const chatContainer = document.getElementById('chatContainer');
		const labelTop = document.getElementById('labelTop');
        const labelBottom = document.getElementById('labelBottom');
		
        const videoSrc = 'https://cdn.jsdelivr.net/gh/vchicolatino/vchicolatino@main/public/video/db/Peliculas/Freezer%20contra%20el%20padre%20de%20Goku/stream.m3u8'; 
        const socket = io();

        let targetLiveTime = 0;
        let lastSyncTimestamp = 0;
        let isStreamActive = false;
        let ultimoVolumen = 1;

        document.addEventListener('click', () => {
            if (video.paused && isStreamActive) {
                video.muted = false;
                video.volume = volumeSlider.value > 0 ? volumeSlider.value : 1;
                video.play().catch(e => console.log(e));
            }
        }, { once: true });

        function calcularTiempoActualTransmision() {
            if (!isStreamActive || lastSyncTimestamp === 0) return 0;
            const transcurrido = (Date.now() - lastSyncTimestamp) / 1000;
            return targetLiveTime + transcurrido;
        }

        function toggleChatMovil() {
            chatContainer.classList.toggle('collapsed');
        }

        video.addEventListener('timeupdate', () => {
            if (video.duration) {
                const porcentaje = (video.currentTime / video.duration) * 100;
                progressFill.style.width = `${porcentaje}%`;

                const tiempoRestanteSegundos = video.duration - video.currentTime;
                const mins = Math.floor(tiempoRestanteSegundos / 60);
                const secs = Math.floor(tiempoRestanteSegundos % 60);
                
                const minsFormat = mins < 10 ? `0${mins}` : mins;
                const secsFormat = secs < 10 ? `0${secs}` : secs;

                timeDisplay.innerText = `-${minsFormat}:${secsFormat}`;

                if (isStreamActive) {
                    const tiempoRealTransmision = calcularTiempoActualTransmision();
                    const diferencia = Math.abs(tiempoRealTransmision - video.currentTime);

                    if (diferencia <= 2.5) {
                        btnLive.classList.add('is-live');
                    } else {
                        btnLive.classList.remove('is-live');
                    }
                } else {
                    btnLive.classList.remove('is-live');
                }
            }
        });

        if (Hls.isSupported()) {
            const hls = new Hls();
            hls.loadSource(videoSrc);
            hls.attachMedia(video);
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = videoSrc;
        }

        function irAlEnVivo() {
            if (!isStreamActive) return;
            const tiempoReal = calcularTiempoActualTransmision();
            video.currentTime = tiempoReal;
            video.play().catch(e => console.log(e));
            btnLive.classList.add('is-live');
        }

        function actualizarIconoVolumen(vol) {
            if (vol == 0 || video.muted) {
                btnVolume.innerText = '🔇';
            } else if (vol < 0.5) {
                btnVolume.innerText = '🔉';
            } else {
                btnVolume.innerText = '🔊';
            }
        }

        function desmutearKick() {
			const kickIframe = document.getElementById('kickIframe');
			// Forzamos la recarga del iframe permitiendo audio tras la interacción del usuario
			if (kickIframe) {
				kickIframe.src = "https://player.kick.com/vchicolatino?autoplay=true&muted=false";
			}
		}

		function mutearKick() {
			const kickIframe = document.getElementById('kickIframe');
			if (kickIframe) {
				kickIframe.src = "https://player.kick.com/vchicolatino?autoplay=true&muted=true";
			}
		}

		/*function ajustarVolumen(valor) {
			video.volume = valor;
			if (valor > 0) {
				if (video.muted) desmutearKick();
				video.muted = false;
				ultimoVolumen = valor;
			} else {
				video.muted = true;
				mutearKick();
			}
			actualizarIconoVolumen(video.muted ? 0 : valor);
		}

		function toggleMute() {
			if (video.muted || video.volume === 0) {
				const nuevoVol = ultimoVolumen > 0 ? ultimoVolumen : 1;
				video.muted = false;
				video.volume = nuevoVol;
				volumeSlider.value = nuevoVol;
				actualizarIconoVolumen(nuevoVol);
				desmutearKick(); // Activa audio en Kick
			} else {
				ultimoVolumen = video.volume;
				video.muted = true;
				video.volume = 0;
				volumeSlider.value = 0;
				actualizarIconoVolumen(0);
				mutearKick(); // Silencia Kick
			}
		}*/

		/* MANEJO DE VOLUMEN UNIFICADO SIN RECARGAR EL IFRAME DE KICK */
		function ajustarVolumen(valor) {
			video.volume = valor;
			if (valor > 0) {
				video.muted = false;
				ultimoVolumen = valor;
			} else {
				video.muted = true;
			}
			actualizarIconoVolumen(video.muted ? 0 : valor);
			
			// Enviamos el mensaje de volumen al iframe sin recargar la página
			sincronizarAudioKick(video.muted ? 0 : valor);
		}
		
		function toggleMute() {
			if (video.muted || video.volume === 0) {
				const nuevoVol = ultimoVolumen > 0 ? ultimoVolumen : 1;
				video.muted = false;
				video.volume = nuevoVol;
				volumeSlider.value = nuevoVol;
				actualizarIconoVolumen(nuevoVol);
				sincronizarAudioKick(nuevoVol);
			} else {
				ultimoVolumen = video.volume;
				video.muted = true;
				video.volume = 0;
				volumeSlider.value = 0;
				actualizarIconoVolumen(0);
				sincronizarAudioKick(0);
			}
		}

		function sincronizarAudioKick(nivelVolumen) {
			const kickIframe = document.getElementById('kickIframe');
			if (kickIframe && kickIframe.contentWindow) {
				// Enviar señal de mutear/desmutear mediante postMessage al reproductor incrustado
				const mensaje = nivelVolumen === 0 ? 'mute' : 'unmute';
				kickIframe.contentWindow.postMessage(JSON.stringify({
					event: mensaje,
					method: 'setVolume',
					value: nivelVolumen
				}), '*');
			}
		}
		
        function intentarReproducirConAudio() {
            video.muted = false;
            video.volume = volumeSlider.value > 0 ? volumeSlider.value : 1;
            
            video.play().then(() => {
                actualizarIconoVolumen(video.volume);
            }).catch(err => {
                video.muted = true;
                actualizarIconoVolumen(0);
                volumeSlider.value = 0;
                video.play();
            });
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                if (theaterDiv.requestFullscreen) {
                    theaterDiv.requestFullscreen();
                } else if (theaterDiv.webkitRequestFullscreen) {
                    theaterDiv.webkitRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                }
            }
        }

		// ESCUCHADORES WEBSOCKET
        socket.on('update-titles', (data) => {
            labelTop.innerText = data.titleTop;
            labelBottom.innerText = data.titleBottom;
        });
		
        socket.on('sync-state', (data) => {
            if(data.playing) {
                video.currentTime = data.time;
                video.play();
            }
        });

        socket.on('play-video', (data) => {
            isStreamActive = true;
            if (data.time !== undefined) {
                targetLiveTime = data.time;
                lastSyncTimestamp = Date.now();
                video.currentTime = data.time;
            }
            intentarReproducirConAudio();
        });

        socket.on('pause-video', () => { 
            video.pause(); 
            isStreamActive = false;
            btnLive.classList.remove('is-live');
        });

        socket.on('resume-video', (data) => {
            isStreamActive = true;
            if (data && data.time !== undefined) {
                targetLiveTime = data.time;
                lastSyncTimestamp = Date.now();
                video.currentTime = data.time;
            }
            intentarReproducirConAudio();
        });

        socket.on('seek-video', (data) => { video.currentTime = data.time; });
    </script>
</body>
</html>
