<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Videoreacción en Vivo</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { margin: 0; background-color: #0b0e14; color: #fff; font-family: sans-serif; }
        .grid-container { display: grid; grid-template-columns: 1fr 350px; height: 100vh; }
        .video-section { display: flex; flex-direction: column; padding: 10px; gap: 10px; box-sizing: border-box; }
        .video-box { flex: 1; background: #000; position: relative; border-radius: 8px; overflow: hidden; }
        video, iframe { width: 100%; height: 100%; border: none; }
        .chat-section { height: 100vh; background: #191b1f; }
    </style>
</head>
<body>
    <div class="grid-container">
        <div class="video-section">
            <!-- Video Sincronizado Privado -->
            <div class="video-box">
                <video id="videoPrivate" controls muted></video>
            </div>
            <!-- Emisión de Kick (Tu Cara / Cámara) -->
            <div class="video-box">
                <iframe src="https://player.kick.com/vchicolatino" allowfullscreen></iframe>
            </div>
        </div>
        <!-- Chat Oficial de Kick -->
        <div class="chat-section">
            <iframe src="https://kick.com/popout/vchicolatino/chat"></iframe>
        </div>
    </div>

    <script>
        const video = document.getElementById('videoPrivate');
        const statusDiv = document.getElementById('status');
        
        // Tu URL de jsDelivr
        const videoSrc = 'https://cdn.jsdelivr.net/gh/vchicolatino/vchicolatino@main/public/video/db/Peliculas/Freezer%20contra%20el%20padre%20de%20Goku/stream.m3u8'; 
        const socket = io();
        let hls;

        function cargarVideo() {
            if (Hls.isSupported()) {
                if(hls) hls.destroy();
                hls = new Hls();
                hls.loadSource(videoSrc);
                hls.attachMedia(video);

                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    statusDiv.innerText = "Estado: Video Cargado Correctamente";
                });

                hls.on(Hls.Events.ERROR, function (event, data) {
                    console.error("Error HLS:", data);
                    statusDiv.innerText = "Error al cargar el video";
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = videoSrc;
            }
        }

        cargarVideo();

        // Iniciar desde el principio (o un tiempo específico)
        socket.on('play-video', (data) => {
            statusDiv.innerText = "Estado: Reproduciendo...";
            video.currentTime = data.time || 0;
            video.play().catch(err => {
                statusDiv.innerText = "Haz clic en el video para reproducir";
            });
        });

        // Pausar manteniéndose en el segundo actual
        socket.on('pause-video', () => { 
            video.pause(); 
            statusDiv.innerText = "Estado: Pausado";
        });

        // NUEVO: Reanudar desde donde se pausó
        socket.on('resume-video', () => {
            video.play().catch(err => {
                statusDiv.innerText = "Haz clic en el video para reanudar";
            });
            statusDiv.innerText = "Estado: Reproduciendo...";
        });
    </script>
</body>
</html>
